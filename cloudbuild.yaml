# trigger by github 
# docker build & push artifact registry
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', '-t',
      'asia-northeast1-docker.pkg.dev/$PROJECT_ID/repointerviewer/backend',
      './backend'
    ]

  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'asia-northeast1-docker.pkg.dev/$PROJECT_ID/repointerviewer/backend'
    ]
# release 
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'deploy', 'releases', 'create', 'release-$(date +%s)',
        '--delivery-pipeline=repointerviewer-pipeline',
        '--region=asia-northeast1',
        '--source=.',
        '--skaffold-file=skaffold.yaml'
      ]
