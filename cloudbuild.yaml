steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', '-t',
      'asia-northeast1-docker.pkg.dev/$PROJECT_ID/repointerviewer/backend',
      './backend'
    ]

  # Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'asia-northeast1-docker.pkg.dev/$PROJECT_ID/repointerviewer/backend'
    ]

  # Release via Cloud Deploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        PROJECT_ID=$(gcloud config get-value project)
        export GOOGLE_API_KEY=$(gcloud secrets versions access latest --secret="google-api-key")
        export MODEL_NAME=$(gcloud secrets versions access latest --secret="model-name")
        export REDIS_HOST=$(gcloud secrets versions access latest --secret="redis-host-stg")

        gcloud deploy releases create release-$(date +%s) \
          --delivery-pipeline=repointerviewer-pipeline \
          --region=asia-northeast1 \
          --project=$PROJECT_ID \
          --source=. \
          --skaffold-file=skaffold.yaml

options:
  logging: CLOUD_LOGGING_ONLY
