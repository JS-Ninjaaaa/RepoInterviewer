steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/${_PROJECT_ID}/${_PROJECT_ID}/backend'
      - './backend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-northeast1-docker.pkg.dev/${_PROJECT_ID}/${_PROJECT_ID}/backend'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'config'
      - 'set'
      - 'project'
      - '${_PROJECT_ID}'
      - 'gcloud'
      - 'deploy'
      - 'releases'
      - 'create'
      - 'release-$(date +%s)'
      - '--delivery-pipeline=repointerviewer-pipeline'
      - '--region=asia-northeast1'
      - '--project=${_PROJECT_ID}'
      - '--source=.'
      - '--skaffold-file=skaffold.yaml'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _PROJECT_ID: repointerviewer