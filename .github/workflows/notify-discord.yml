# .github/workflows/notify-discord.yml
name: Notify Discord on PR Events

################################################################################
# イベント構成
#   - pull_request.review_requested : レビュワー指名時
#   - pull_request.closed          : PR マージ時
#   - pull_request_review.submitted: レビュー提出時
#     （state = approved / changes_requested / commented すべて受け取る）
################################################################################
on:
  pull_request:
    types: [review_requested, closed]

  pull_request_review:
    types: [submitted]

################################################################################
# 1. レビュー依頼通知
################################################################################
jobs:
  notify_review_requested:
    if: github.event_name == 'pull_request' && github.event.action == 'review_requested'
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Write user_map.json
        run: echo '${{ secrets.DISCORD_USER_MAP_JSON }}' > user_map.json
      - name: Notify reviewer
        env:
          REVIEWER: ${{ github.event.requested_reviewer.login }}
          PR_URL:   ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          WEBHOOK:  ${{ secrets.DISCORD_PR_WEBHOOK }}
        run: |
          DISCORD_ID=$(jq -r --arg user "$REVIEWER" '.[$user]' user_map.json)
          MENTION="@here"
          [ "$DISCORD_ID" != "null" ] && [ -n "$DISCORD_ID" ] && MENTION="<@$DISCORD_ID>"
          jq -n --arg content "$MENTION 👀 レビュー依頼が届きました: [$PR_TITLE]($PR_URL)" \
                '{content:$content}' > msg.json
          curl -H "Content-Type: application/json" -X POST -d @msg.json "$WEBHOOK"

################################################################################
# 2. レビュー提出通知
################################################################################
  notify_review_submitted:
    # authorのコメントは無視する
    if: github.event_name == 'pull_request_review' &&
        github.event.action   == 'submitted'          &&
        github.event.review.user.login != github.event.pull_request.user.login
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Write user_map.json
        run: echo '${{ secrets.DISCORD_USER_MAP_JSON }}' > user_map.json
      - name: Notify on review submission
        env:
          AUTHOR:       ${{ github.event.pull_request.user.login }}
          REVIEWER:     ${{ github.event.review.user.login }}
          REVIEW_STATE: ${{ github.event.review.state }}       # approved / changes_requested / commented
          REVIEW_URL:   ${{ github.event.review.html_url }}
          WEBHOOK:      ${{ secrets.DISCORD_PR_WEBHOOK }}
        run: |
          case "$REVIEW_STATE" in
            approved)          ICON="✅";;
            changes_requested) ICON="❌";;
            commented)         ICON="💬";;
            *)                 ICON="";;
          esac
          DISCORD_ID=$(jq -r --arg user "$AUTHOR" '.[$user]' user_map.json)
          MENTION="@here"
          [ "$DISCORD_ID" != "null" ] && [ -n "$DISCORD_ID" ] && MENTION="<@$DISCORD_ID>"
          jq -n --arg content "$MENTION $ICON レビューが提出されました: $REVIEW_URL" \
                '{content:$content}' > msg.json
          curl -H "Content-Type: application/json" -X POST -d @msg.json "$WEBHOOK"

################################################################################
# 3. PR マージ通知
################################################################################
  notify_pr_merged:
    if: github.event_name == 'pull_request' &&
        github.event.action == 'closed'     &&
        github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Write user_map.json
        run: echo '${{ secrets.DISCORD_USER_MAP_JSON }}' > user_map.json
      - name: Notify on merge
        env:
          AUTHOR:   ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL:   ${{ github.event.pull_request.html_url }}
          WEBHOOK:  ${{ secrets.DISCORD_PR_WEBHOOK }}
        run: |
          DISCORD_ID=$(jq -r --arg user "$AUTHOR" '.[$user]' user_map.json)
          MENTION="@here"
          [ "$DISCORD_ID" != "null" ] && MENTION="<@$DISCORD_ID>"
          jq -n --arg content "$MENTION ✅ PR がマージされました: [$PR_TITLE]($PR_URL)" \
                '{content:$content}' > msg.json
          curl -H "Content-Type: application/json" -X POST -d @msg.json "$WEBHOOK"
