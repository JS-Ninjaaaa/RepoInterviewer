name: Notify Discord on PR Events

on:
  pull_request:
    types: [opened, review_requested, closed]
  pull_request_review:
    types: [submitted]

jobs:
  notify_on_opened_with_reviewers:
    if: github.event.action == 'opened' && github.event.pull_request.requested_reviewers != ''
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Write user_map.json
        run: echo '${{ secrets.DISCORD_USER_MAP_JSON }}' > user_map.json

      - name: Notify reviewers specified at PR creation
        env:
          REVIEWERS_JSON: ${{ toJson(github.event.pull_request.requested_reviewers) }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          WEBHOOK: ${{ secrets.DISCORD_PR_WEBHOOK }}
        run: |
          echo "$REVIEWERS_JSON" | jq -c '.[]' | while read reviewer; do
            LOGIN=$(echo "$reviewer" | jq -r '.login')
            DISCORD_ID=$(jq -r --arg user "$LOGIN" '.[$user]' user_map.json)
            MENTION="@here"
            [ "$DISCORD_ID" != "null" ] && MENTION="<@$DISCORD_ID>"

            cat <<EOF > message.json
            {
              "content": "$MENTION 👀PRが作成されました。レビューをお願いします: [$PR_TITLE]($PR_URL)"
            }
          EOF
            curl -H "Content-Type: application/json" -X POST -d @message.json "$WEBHOOK"
          done

  notify_review_requested:
    if: github.event.action == 'review_requested'
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Write user_map.json
        run: echo '${{ secrets.DISCORD_USER_MAP_JSON }}' > user_map.json

      - name: Notify reviewer
        env:
          REVIEWER: ${{ github.event.requested_reviewer.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          WEBHOOK: ${{ secrets.DISCORD_PR_WEBHOOK }}
        run: |
          USER="$REVIEWER"
          DISCORD_ID=$(jq -r --arg user "$USER" '.[$user]' user_map.json)
          MENTION="@here"
          [ "$DISCORD_ID" != "null" ] && MENTION="<@$DISCORD_ID>"

          cat <<EOF > message.json
          {
            "content": "$MENTION 👀レビューがリクエストされました: [$PR_TITLE]($PR_URL)"
          }
          EOF
          curl -H "Content-Type: application/json" -X POST -d @message.json "$WEBHOOK"

  notify_review_submitted:
    if: github.event_name == 'pull_request_review' && github.event.action == 'submitted'
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Write user_map.json
        run: echo '${{ secrets.DISCORD_USER_MAP_JSON }}' > user_map.json

      - name: Notify PR author on review
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          REVIEWER: ${{ github.event.review.user.login }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_URL: ${{ github.event.review.html_url }}
          WEBHOOK: ${{ secrets.DISCORD_PR_WEBHOOK }}
        run: |
          USER="$AUTHOR"
          DISCORD_ID=$(jq -r --arg user "$USER" '.[$user]' user_map.json)
          MENTION="@here"
          [ "$DISCORD_ID" != "null" ] && MENTION="<@$DISCORD_ID>"

          cat <<EOF > message.json
          {
            "content": "$MENTION 📝$REVIEWER がレビューを投稿しました（$REVIEW_STATE）: $REVIEW_URL"
          }
          EOF
          curl -H "Content-Type: application/json" -X POST -d @message.json "$WEBHOOK"

  notify_pr_merged:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Write user_map.json
        run: echo '${{ secrets.DISCORD_USER_MAP_JSON }}' > user_map.json

      - name: Notify PR author on merge
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          WEBHOOK: ${{ secrets.DISCORD_PR_WEBHOOK }}
        run: |
          USER="$AUTHOR"
          DISCORD_ID=$(jq -r --arg user "$USER" '.[$user]' user_map.json)
          MENTION="@here"
          [ "$DISCORD_ID" != "null" ] && MENTION="<@$DISCORD_ID>"

          cat <<EOF > message.json
          {
            "content": "$MENTION ✅PRがマージされました: [$PR_TITLE]($PR_URL)"
          }
          EOF
          curl -H "Content-Type: application/json" -X POST -d @message.json "$WEBHOOK"
