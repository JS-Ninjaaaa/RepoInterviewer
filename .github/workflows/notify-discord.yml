name: Notify Discord on PR Events

on:
  # ① レビュー依頼
  pull_request:
    types: [review_requested,closed]

  # ② レビュー提出（approved / changes_requested / commented すべて）
  pull_request_review:
    types: [submitted]

jobs:
  #############################################################################
  # PRレビュー依頼通知
  #############################################################################
  notify_review_requested:
    if: github.event_name == 'pull_request' && github.event.action == 'review_requested'
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: echo '${{ secrets.DISCORD_USER_MAP_JSON }}' > user_map.json
      - name: Notify reviewer
        env:
          REVIEWER: ${{ github.event.requested_reviewer.login }}
          PR_URL:   ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          WEBHOOK:  ${{ secrets.DISCORD_PR_WEBHOOK }}
        run: |
          DISCORD_ID=$(jq -r --arg user "$REVIEWER" '.[$user]' user_map.json)
          MENTION="@here"; [ "$DISCORD_ID" != "null" ] && MENTION="<@$DISCORD_ID>"
          jq -n --arg content "$MENTION 👀 レビュー依頼: [$PR_TITLE]($PR_URL)" '{content:$content}' \
             > msg.json
          curl -H "Content-Type: application/json" -X POST -d @msg.json "$WEBHOOK"

  #############################################################################
  # レビュー提出通知（初回提出のみ）
  #############################################################################
  notify_review_submitted:
    if: github.event_name == 'pull_request_review' && github.event.action == 'submitted'
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y jq

      - name: Write user_map.json
        run: echo '${{ secrets.DISCORD_USER_MAP_JSON }}' > user_map.json

      - name: Skip if this is an update (reply) rather than the initial submit
        env:
          SUBMITTED_AT: ${{ github.event.review.submitted_at }}
          UPDATED_AT:   ${{ github.event.review.updated_at }}
        run: |
          if [ "$UPDATED_AT" != "$SUBMITTED_AT" ]; then
            echo "Review updated (e.g. reply): skipping notification"
            exit 0
          fi

      - name: Notify on initial review submission
        env:
          AUTHOR:       ${{ github.event.pull_request.user.login }}
          REVIEWER:     ${{ github.event.review.user.login }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_URL:   ${{ github.event.review.html_url }}
          WEBHOOK:      ${{ secrets.DISCORD_PR_WEBHOOK }}
        run: |
          case "$REVIEW_STATE" in
            approved)          ICON="✅";;
            changes_requested) ICON="❌";;
            commented)         ICON="💬";;
            *)                 ICON="";;
          esac
          DISCORD_ID=$(jq -r --arg user "$AUTHOR" '.[$user]' user_map.json)
          MENTION="@here"; [ "$DISCORD_ID" != "null" ] && MENTION="<@$DISCORD_ID>"
          jq -n --arg content "$MENTION $ICON レビューが提出されました: $REVIEW_URL" \
             '{content:$content}' > msg.json
          curl -H "Content-Type: application/json" -X POST -d @msg.json "$WEBHOOK"

  #############################################################################
  # PRマージ通知
  #############################################################################
  notify_pr_merged:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' &&
        github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: echo '${{ secrets.DISCORD_USER_MAP_JSON }}' > user_map.json
      - name: Notify on merge
        env:
          AUTHOR:   ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL:   ${{ github.event.pull_request.html_url }}
          WEBHOOK:  ${{ secrets.DISCORD_PR_WEBHOOK }}
        run: |
          DISCORD_ID=$(jq -r --arg user "$AUTHOR" '.[$user]' user_map.json)
          MENTION="@here"; [ "$DISCORD_ID" != "null" ] && MENTION="<@$DISCORD_ID>"
          jq -n --arg content "$MENTION ✅ PRがマージされました: [$PR_TITLE]($PR_URL)" \
             '{content:$content}' > msg.json
          curl -H "Content-Type: application/json" -X POST -d @msg.json "$WEBHOOK"
