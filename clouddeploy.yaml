apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: repointerviewer-pipeline
description: RepoInterviewer deployment pipeline
serialPipeline:
  stages:
    - targetId: backend-stg
      profiles: [staging]
    - targetId: backend-prod
      profiles: [production]

---

apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: backend-stg
description: Staging environment
run:
  location: projects/$PROJECT_ID/locations/asia-northeast1

---

apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: backend-prod
description: Production environment
run:
  location: projects/$PROJECT_ID/locations/asia-northeast1
